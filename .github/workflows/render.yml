name: render-reel
on:
  push:
    paths:
      - "jobs/test.json"
  workflow_dispatch:
    inputs:
      id:
        description: "output file id (letters, digits, - _)"
        required: true
      payload:
        description: "reel JSON"
        required: true
permissions:
  contents: write
concurrency:
  group: render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Resolve payload
        env:
          IN_ID: ${{ inputs.id }}
          IN_PAYLOAD: ${{ inputs.payload }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            printf '%s' "$IN_PAYLOAD" > /tmp/payload.json; ID="$IN_ID"
          else
            cp jobs/test.json /tmp/payload.json; ID=$(node -e "console.log(require('/tmp/payload.json').id)")
          fi
          echo "$ID" | grep -Eq '^[A-Za-z0-9_-]{1,60}$' || { echo "bad id"; exit 1; }
          echo "ID=$ID" >> "$GITHUB_ENV"
      - name: Install
        timeout-minutes: 5
        run: cd render && npm ci --no-audit --no-fund
      - name: Render
        timeout-minutes: 10
        run: |
          mkdir -p out
          node render/render.mjs /tmp/payload.json "out/${ID}.mp4"
      - name: Commit video
        run: |
          git config user.name "seedtech-reels-bot"
          git config user.email "bot@users.noreply.github.com"
          # keep only the 20 newest videos
          ls -t out/*.mp4 | tail -n +21 | xargs -r git rm -q --cached -f || true
          ls -t out/*.mp4 | tail -n +21 | xargs -r rm -f
          git add out
          git commit -m "render ${ID}"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break || sleep 5; done
